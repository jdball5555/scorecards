name: scorecards_app
description: "A new Flutter project."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  flutter_riverpod: ^2.5.1
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "lib/assets/icons/app_icon.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#05050A" # Matches your app's pitch black/deep blue background void
  image: "lib/assets/icons/app_icon.png" # Points to your sharp 1024x1024 icon
  android_12:
    image: "lib/assets/icons/app_icon.png"
    color: "#05050A"
