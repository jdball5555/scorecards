name: scorecards_app
description: "Score card and board games with friends: built-in and custom scorecards, groups and stats."
publish_to: "none"
version: 1.0.3+6

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.9.0
  cloud_firestore: ^6.4.1
  firebase_auth: ^6.5.1
  flutter_riverpod: ^2.5.1
  google_sign_in: ^7.2.0
  firebase_messaging: ^16.3.0
  fl_chart: ^1.2.0
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.16.0
  http: ^1.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_mark.png
    - assets/branding/app_logo.png
    - assets/branding/app_mark_square.png
    - assets/branding/app_logo_square.png

flutter_launcher_icons:
  # Phone app: a circle (Android's adaptive icon; launchers mask it round).
  # Website and desktop: a rounded square, like Axis Team.
  # Sources are made by the icon script from assets/icons/app_icon.png.
  image_path: "assets/icons/app_icon.png"
  android: "launcher_icon"
  image_path_android: "assets/icons/app_icon_round.png"
  adaptive_icon_background: "#05050A"
  adaptive_icon_foreground: "assets/icons/app_icon_android_foreground.png"
  ios: true
  # Full-bleed (no circle): iOS rounds the corners itself.
  image_path_ios: "assets/icons/app_icon_square.png"
  remove_alpha_ios: true
  web:
    generate: true
    image_path: "assets/icons/app_icon_square.png"
    background_color: "#05050A"
    theme_color: "#05050A"
  macos:
    generate: true
    image_path: "assets/icons/app_icon_macos.png"
  windows:
    generate: true
    image_path: "assets/icons/app_icon_rounded.png"
    icon_size: 256

flutter_native_splash:
  color: "#05050A" # Matches your app's pitch black/deep blue background void
  image: "assets/icons/app_icon.png" # Points to your sharp 1024x1024 icon
  android_12:
    image: "assets/icons/app_icon.png"
    color: "#05050A"
